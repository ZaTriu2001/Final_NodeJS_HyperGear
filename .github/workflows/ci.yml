name: HyperGear CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  verify:
    # MongoDB 8 rejects affected Linux >=6.19 kernels (SERVER-121912).
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:integration
        env:
          MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.local/mongodb-binaries
      - run: npm run demo:setup && docker compose config --quiet
      - name: Start full Docker stack
        # Also exercise first-run JWT generation without a developer .env file.
        run: docker compose --env-file /dev/null up -d --build --wait --wait-timeout 180
      - name: Verify checkout and SMTP emails
        run: node scripts/smoke.mjs
      - name: Verify admin, realtime, Elasticsearch and PC Builder
        run: npm run test:m3-m4
        env:
          REDIS_URL: redis://127.0.0.1:6379
          ELASTICSEARCH_URL: http://127.0.0.1:9200
      - name: Verify Nginx balances gateways and sessions remain valid
        run: node scripts/scaling-smoke.mjs
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium --only-shell
      - name: Verify desktop and mobile browser flows
        run: npm run test:browser
      - name: Verify RabbitMQ retry and idempotency
        run: node --test tests/messaging.test.mjs
      - name: Save browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qa
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down
